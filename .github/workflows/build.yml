name: Build Chat3DS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Create Chat3DS icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          w = h = 48
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  # Deep blue diagonal background with a subtle cyan glow.
                  t = (x + y) / 94
                  r, g, b = int(8 + 12*t), int(18 + 24*t), int(48 + 42*t)
                  # Rounded speech bubble.
                  inside = 8 <= x <= 39 and 8 <= y <= 32
                  corner = ((x-8)**2 + (y-8)**2 <= 16 or
                            (x-39)**2 + (y-8)**2 <= 16 or
                            (x-8)**2 + (y-32)**2 <= 16 or
                            (x-39)**2 + (y-32)**2 <= 16)
                  if inside and (not corner or
                     ((x-8)**2 + (y-8)**2 <= 16 and x < 12 and y < 12) or
                     ((x-39)**2 + (y-8)**2 <= 16 and x > 35 and y < 12) or
                     ((x-8)**2 + (y-32)**2 <= 16 and x < 12 and y > 28) or
                     ((x-39)**2 + (y-32)**2 <= 16 and x > 35 and y > 28)):
                      r, g, b = 44, 205, 230
                  # Speech-bubble tail.
                  if 8 <= x <= 19 and 28 <= y <= 41 and y >= 41 - (x-8):
                      r, g, b = 44, 205, 230
                  # Three dark-blue message dots.
                  for dx in (17, 24, 31):
                      if (x-dx)**2 + (y-20)**2 <= 3:
                          r, g, b = 7, 29, 68
                  # Tiny four-point sparkle in the upper-right.
                  if (x == 39 and 4 <= y <= 8) or (y == 6 and 37 <= x <= 41):
                      r, g, b = 255, 255, 255
                  row.extend((r, g, b))
              rows.append(b'\x00' + bytes(row))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
          png += chunk(b'IEND', b'')
          open('icon.png', 'wb').write(png)
          PY

      - name: Compile Chat3DS
        run: make

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: Chat3DS-Intermediate
          if-no-files-found: error
          path: |
            Chat3ds.3dsx
            Chat3ds.elf
            Chat3ds.smdh

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Download compiled files
        uses: actions/download-artifact@v4
        with:
          name: Chat3DS-Intermediate

      - name: Install makerom
        run: |
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -O /tmp/makerom.zip
          mkdir -p /tmp/makerom
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          MAKEROM="$(find /tmp/makerom -type f -name makerom | head -n 1)"
          test -n "$MAKEROM"
          chmod +x "$MAKEROM"

      - name: Package installable CIA
        run: |
          MAKEROM="$(find /tmp/makerom -type f -name makerom | head -n 1)"
          "$MAKEROM" -f cia -o Chat3ds.cia -target t -elf Chat3ds.elf -rsf cia.rsf -icon Chat3ds.smdh -desc app:4 -exefslogo
          test -s Chat3ds.cia

      - name: Upload 3DS files
        uses: actions/upload-artifact@v4
        with:
          name: Chat3DS-Build
          if-no-files-found: error
          path: |
            Chat3ds.3dsx
            Chat3ds.cia
            Chat3ds.elf
            Chat3ds.smdh

      - name: Publish CIA as GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chat3ds-build-${{ github.run_number }}
          name: Chat3DS Build ${{ github.run_number }}
          body: Automatically built Chat3DS CIA. Download Chat3ds.cia and install it with FBI.
          files: Chat3ds.cia
          prerelease: true

      - name: Keep only the newest Chat3DS release
        uses: actions/github-script@v7
        with:
          script: |
            const currentTag = `chat3ds-build-${context.runNumber}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              if (release.tag_name.startsWith('chat3ds-build-') && release.tag_name !== currentTag) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
                } catch (error) {
                  core.info(`Could not remove tag ${release.tag_name}: ${error.message}`);
                }
              }
            }
